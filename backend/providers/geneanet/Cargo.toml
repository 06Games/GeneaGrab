[package]
name = "geneagrab-provider-geneanet"
version = "4.0.0"
edition = "2021"

[dependencies]
geneagrab-providers = { path = "../common" }
async-trait = "0.1.91"
regex = "1.13.1"
scraper = "0.22.0"
url = "2.5.8"
serde_json = "1.0"
deunicode = "1.6.2"

[dev-dependencies]
datatest-stable = "0.3.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
serde-json-assert = "0.4.0"
reqwest = { version = "0.13.4", features = ["blocking"] }

[[test]]
name = "extract_registry_integration"
harness = false
