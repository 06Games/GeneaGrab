[package]
name = "geneagrab-providers"
version = "4.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "serde"] }
thiserror = "2.0.18"
derive_builder = "0.20.2"
regex = "1.12.3"
quick-xml = { version = "0.39.2", features = ["serialize"] }
url = "2.5.8"
strum = { version = "0.28.0", features = ["derive"] }
scraper = "0.27.0"
deunicode = "1.6.0"
base64 = "0.22.1"
async-trait = "0.1.86"
dates = { path = "../../dates" }
wreq = "6.0.0-rc.28"
wreq-util = "3.0.0-rc.10"
futures = "0.3.32"
tracing = "0.1.44"
tokio = { version = "1.50.0", features = ["sync"] }


