[package]
name = "geneagrab-providers"
version = "4.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
thiserror = "2.0.19"
derive_builder = "0.20.2"
regex = "1.13.1"
quick-xml = { version = "0.39.4", features = ["serialize"] }
url = "2.5.8"
strum = { version = "0.28.0", features = ["derive"] }
scraper = "0.27.0"
deunicode = "1.6.2"
base64 = "0.22.1"
async-trait = "0.1.91"
dates = { path = "../../dates" }
wreq = "6.0.0-rc.29"
wreq-util = "3.0.0-rc.14"
futures = "0.3.33"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["sync"] }


