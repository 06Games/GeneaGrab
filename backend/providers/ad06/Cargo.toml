[package]
name = "geneagrab-plugin-ad06"
version = "4.0.0"
edition = "2021"

[dependencies]
geneagrab-providers = { path = "../common" }
async-trait = "0.1.86"
regex = "1.11.1"
scraper = "0.22.0"
base64 = "0.22.1"
tracing = "0.1.44"
url = "2.5.8"
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["sync"] }
ddddocr = "0.1.0"

[dev-dependencies]
datatest-stable = "0.3.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
serde-json-assert = "0.4.0"
jsonc-parser = { version = "0.32.4", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["blocking"] }

[[test]]
name = "extract_registry_integration"
harness = false
