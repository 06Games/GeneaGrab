[package]
name = "geneagrab-provider-ad06"
version = "4.0.0"
edition = "2021"

[dependencies]
geneagrab-providers = { path = "../common" }
async-trait = "0.1.91"
regex = "1.13.1"
scraper = "0.22.0"
base64 = "0.22.1"
tracing = "0.1.44"
url = "2.5.8"
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["sync"] }
ort = "2.0.0-rc.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
datatest-stable = "0.3.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
serde-json-assert = "0.4.0"
reqwest = { version = "0.13.4", features = ["blocking"] }

[[test]]
name = "extract_registry_integration"
harness = false
