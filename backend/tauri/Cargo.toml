[package]
name = "geneagrab-tauri"
version = "4.0.0"
description = "A tool to download images of digitised registers"
authors = ["EvanG"]
license = "GPL"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "geneagrab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
geneagrab-plugin-core = { path = "../plugin_core" }
geneagrab-core = { path = "../core" }
migration = { path = "../migration" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tokio = "1.50.0"
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
] }
tracing = { version = "0.1.44", features = ["log-always"] }
anyhow = "1.0.102"
tauri-plugin-opener = "2"
