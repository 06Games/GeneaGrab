[package]
name = "geneagrab-core"
version = "4.0.0"
edition = "2021"

[dependencies]
geneagrab-plugin-core = { path = "../plugin_core", features = ["host"] }
dates = { path = "../plugin_common/dates" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.18"
chrono = "0.4.44"
extism = "1.13.0"
tokio = "1.50.0"
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
] }
serde_json = "1.0.149"
wreq = "6.0.0-rc.28"
wreq-util = "3.0.0-rc.10"
image = "0.25.10"
futures = "0.3.32"
tracing = { version = "0.1.44" }
