[package]
name = "geneagrab-core"
version = "4.0.0"
edition = "2021"

[dependencies]
geneagrab-providers = { path = "../providers/common" }
geneagrab-provider-ad06 = { path = "../providers/ad06" }
geneagrab-provider-geneanet = { path = "../providers/geneanet" }
dates = { path = "../dates" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.19"
chrono = "0.4.45"
async-trait = "0.1.91"
sea-orm = { version = "2.0.0", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
] }
serde_json = "1.0.151"
wreq = "6.0.0-rc.29"
wreq-util = "3.0.0-rc.14"
image = "0.25.10"
futures = "0.3.33"
tracing = { version = "0.1.44" }
