[package]
name = "geneagrab-plugin-ad06"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geneagrab-plugin-core = { path = "../../plugin_core", features = [
    "guest",
    "protocols-ligeo",
    "protocols-iiif",
] }
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12.3"
url = "2.5.8"
scraper = "0.26.0"
deunicode = "1.6.2"

[dev-dependencies]
geneagrab-plugin-core = { path = "../../plugin_core", features = ["test"] }
datatest-stable = "0.2"

[[test]]
name = "extract_registry_integration"
harness = false
