[package]
name = "geneagrab-plugin-geneanet"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
geneagrab-plugin-core = { path = "../../plugin_core", features = [
    "guest",
    "protocols-zoomify",
] }
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12.3"
url = "2.5.8"
scraper = "0.26.0"

[dev-dependencies]
assert-json-diff = "2.0.2"
