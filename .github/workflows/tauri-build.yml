name: Build

on:
  push:
    branches:
      - v4
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - id: macos-intel
            platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - id: linux
            platform: "ubuntu-24.04"
            args: ""
            target: ""
          - id: windows
            platform: "windows-latest"
            args: ""
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Target
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: Run sccache-action
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend"

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld clang
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> $GITHUB_ENV



      - name: Install Tauri CLI
        run: bun add -g @tauri-apps/cli@^2.0.0

      - name: Build Tauri App
        working-directory: ./backend/tauri
        run: bunx tauri build ${{ matrix.args }}

      - name: Upload App Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geneagrab-app-${{ matrix.id }}
          path: |
            backend/target/**/release/bundle/**/*.dmg
            backend/target/**/release/bundle/**/*.AppImage
            backend/target/**/release/bundle/**/*.rpm
            backend/target/**/release/bundle/**/*.deb
            backend/target/**/release/bundle/**/*.msi
            backend/target/**/release/bundle/**/*.exe
            backend/target/*/release/bundle/**/*.dmg
            backend/target/*/release/bundle/**/*.AppImage
            backend/target/*/release/bundle/**/*.rpm
            backend/target/*/release/bundle/**/*.deb
            backend/target/*/release/bundle/**/*.msi
            backend/target/*/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            backend/target/release/bundle/**/*.dmg
            backend/target/release/bundle/**/*.AppImage
            backend/target/release/bundle/**/*.rpm
            backend/target/release/bundle/**/*.deb
            backend/target/release/bundle/**/*.msi
            backend/target/release/bundle/**/*.exe
            backend/target/*/release/bundle/**/*.dmg
            backend/target/*/release/bundle/**/*.AppImage
            backend/target/*/release/bundle/**/*.rpm
            backend/target/*/release/bundle/**/*.deb
            backend/target/*/release/bundle/**/*.msi
            backend/target/*/release/bundle/**/*.exe
